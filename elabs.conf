# Non-SSL/HTTPS request on port 80
<VirtualHost 129.74.246.40:80>
    ServerName dev-24.i2u2.org
    ServerAlias i2u2-dev-24.crc.nd.edu
    ServerAdmin e-labs-help@fnal.gov

    # Redirect to HTTPS URL http://i2u2-dev.crc.nd.edu/
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =dev-24.i2u2.org [OR]
    RewriteCond %{SERVER_NAME} =i2u2-dev-24.crc.nd.edu [OR]
    RewriteCond %{SERVER_NAME} =i2u2-dev-24.virtual.crc.nd.edu
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>


# SSL/HTTPS requeset on port 443
<VirtualHost 129.74.246.40:443>
    # Server Name
    ServerName dev-24.i2u2.org
    ServerAlias i2u2-dev-24.crc.nd.edu
    ServerAdmin e-labs-help@fnal.gov

    # XSS Protection
    Header set X-XSS-Protection "1; mode=block"

    # Compression
    # Performance booster: Deflate compression can reduce response size
    # by up to an order of magnitude for certain filetypes, reducing
    # network traffic and speeding page load time.
    # Added 20May2022 - JG
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain text/html text/css
        AddOutputFilterByType DEFLATE text/javascript text/xml image/svg+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/x-font
        AddOutputFilterByType DEFLATE application/x-font-truetype
        AddOutputFilterByType DEFLATE application/x-font-ttf
        AddOutputFilterByType DEFLATE application/x-font-otf
        AddOutputFilterByType DEFLATE application/x-font-opentype
        AddOutputFilterByType DEFLATE application/vnd.ms-fontobject font/ttf
        AddOutputFilterByType DEFLATE font/otf font/opentype
    </IfModule>

    # Logging Directives
    SetEnvIfNoCase Request_URI "/elab/dwr/exec/UploadMonitor.getUploadInfo" dontlog
    SetEnvIfNoCase Request_URI "/elab/cosmic/include" dontlog
    SetEnvIfNoCase Request_URI "/elab/cosmic/notifications" dontlog
    CustomLog /var/log/apache2/www.i2u2.org.log common env=!dontlog

    # Tomcat proxy Information
    ProxyRequests Off
    ProxyPassReverse  /        ajp://localhost:8009/
    # Self-hosted Ganglia proxy (needs to be first)
    ProxyPass        /ganglia    http://vm7.i2u2.org/ganglia
    ProxyPassReverse    /ganglia    http://vm7.i2u2.org/ganglia

    ProxyPass    /tla        !
    ProxyPass    /ligo/tla    !
    ProxyPass    /data        !
    ProxyPass    /library    !
    ProxyPass    /glossary    !
    ProxyPass    /cosmic/library    !
    ProxyPassMatch  /elab/.*/teacher/library !
    ProxyPass    /images        !
    ProxyPass    /img        !
    ProxyPass    /stats        !
    ProxyPass    /user_profile    !
    ProxyPass    /view        !
    ProxyPassMatch  ^/elab/.*/forum  !
    ProxyPass    /cms/cima    !
    ProxyPassMatch    ^/elab/.*/cima    !
    ProxyPass    /cms/cima-wzh    !
    ProxyPassMatch  ^/elab/.*/cima-wzh  !
    ProxyPass    /ops        !
    ProxyPass    /plan        !
    ProxyPassMatch ^(/.*\.php)$    !
    ProxyPass      /elab        ajp://localhost:8009/elab
    ProxyPass      /ilab        ajp://localhost:8009/ilab
    ProxyPass      /css        ajp://localhost:8009/css
    ProxyPass      /graphics    ajp://localhost:8009/graphics
    ProxyPass      /ROOT        ajp://localhost:8009/ROOT
    ProxyPass      /tests    ajp://localhost:8009/tests
    ProxyPassMatch ^/(.*)\.jsp$    ajp://localhost:8009/$1.jsp
    ProxyPassMatch ^/$    ajp://localhost:8009/


    # Forum
    DocumentRoot "/home/quarkcat/sw/www-php/boinc/html/user"
    DirectoryIndex index.php index.html index.htm index.shtml
    AliasMatch ^/elab/(.*)/forum/user_profile/(.*)$  /home/quarkcat/sw/www-php/boinc/html/user_profile/$2
    AliasMatch ^/elab/(.*)/forum/(.*)$ /home/quarkcat/sw/www-php/boinc/html/user/$2
    Alias    /user_profile    "/home/quarkcat/sw/www-php/boinc/html/user_profile"
    Alias    /ops    "/home/quarkcat/sw/www-php/boinc/html/ops"

    ScriptAlias  /cgi-bin /home/quarkcat/sw/www-php/boinc/cgi-bin

    <Directory "/home/quarkcat/sw/www-php/boinc/html/user">
        Options FollowSymlinks MultiViews IncludesNoExec
        AllowOverride Limit Indexes
        Require all granted
    </Directory>

    <Directory "/home/quarkcat/sw/www-php/boinc/html/user_profile">
        Options IncludesNoExec
        AllowOverride AuthConfig Limit FileInfo
        Require all granted
    </Directory>

    <Directory "/home/quarkcat/sw/www-php/boinc/html/ops">
        Options Indexes FollowSymlinks MultiViews IncludesNoExec
        AllowOverride FileInfo AuthConfig Limit Indexes
        Require all granted
    </Directory>


    # QuarkNet Library
    Alias    /teacher/library    "/home/quarkcat/sw/www-php/quarknet-fellows-library"
    Alias    /cosmic/library     "/home/quarkcat/sw/www-php/quarknet-fellows-library"
    Alias    /ligo/library       "/home/quarkcat/sw/www-php/quarknet-fellows-library"
    Alias    /cms/library        "/home/quarkcat/sw/www-php/quarknet-fellows-library"
    AliasMatch ^/elab/(.*)/teacher/library/(.*)$    /home/quarkcat/sw/www-php/quarknet-fellows-library/$2

    <Directory "/home/quarkcat/sw/www-php/quarknet-fellows-library" >
        Options FollowSymlinks IncludesNoExec
        AllowOverride AuthConfig Limit
        Require all granted
    </Directory>


    # Glossary
    Alias   /glossary    "/home/quarkcat/sw/www-php/i2u2-library"
    Alias   /library     "/home/quarkcat/sw/www-php/i2u2-library"

    <Directory "/home/quarkcat/sw/www-php/i2u2-library">
        Options FollowSymlinks MultiViews IncludesNoExec
        AllowOverride Limit Indexes
        Require all granted
    </Directory>


    # Blog
    Alias    /blog    "/home/quarkcat/sw/www-php/wordpress"

    <Directory "/home/quarkcat/sw/www-php/wordpress/wp-content">
        Require all granted
    </Directory>


    # CIMA
    DocumentRoot "/home/quarkcat/sw/www-php/cima"
        Alias       /cms/cima    "home/quarkcat/sw/www-php/cima"
    AliasMatch  ^/elab/(.*)/cima/(.*)$    /home/quarkcat/sw/www-php/cima/$2


    <Directory "/home/quarkcat/sw/www-php/cima">
        Options -Indexes +FollowSymlinks +MultiViews
        AllowOverride none
        Require all granted
    </Directory>


    # CIMA-WZH
    DocumentRoot "/home/quarkcat/sw/www-php/cima-wzh"
    Alias        /cms/cima-wzh    "home/quarkcat/sw/www-php/cima-wzh"
    AliasMatch  ^/elab/(.*)/cima-wzh/(.*)$      /home/quarkcat/sw/www-php/cima-wzh/$2

    <Directory "/home/quarkcat/sw/www-php/cima-wzh">
        Options -Indexes +FollowSymlinks +MultiViews
        AllowOverride none
        Require all granted
    </Directory>

    # SSL Certificates
    #Include /etc/letsencrypt/options-ssl-apache.conf
    #SSLCertificateFile /etc/letsencrypt/live/dev-24.i2u2.org/fullchain.pem
    #SSLCertificateKeyFile /etc/letsencrypt/live/dev-24.i2u2.org/privkey.pem

</VirtualHost>
